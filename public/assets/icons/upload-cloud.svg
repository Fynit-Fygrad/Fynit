<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradient for the cloud -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    
    <!-- Gradient for the arrow -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1B60DF" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Cloud Shape -->
  <path 
    d="M84 75H36c-13.25 0-24-10.75-24-24 0-12.87 10.15-23.4 22.9-23.95A28.017 28.017 0 0 1 61.5 12c12.3 0 22.84 8.04 26.68 19.38A18.01 18.01 0 0 1 84 75z" 
    fill="url(#cloudGradient)" 
    filter="url(#dropShadow)"
  />

  <!-- Upload Arrow -->
  <path 
    d="M60 28L42 46h12v16h12V46h12L60 28z" 
    fill="url(#arrowGradient)" 
  />
  
  <!-- Decorative small circles to simulate 3D floating elements -->
  <circle cx="20" cy="30" r="4" fill="#a78bfa" opacity="0.8" />
  <circle cx="95" cy="25" r="3" fill="#34d399" opacity="0.8" />
  <circle cx="100" cy="65" r="4" fill="#fbbf24" opacity="0.8" />
</svg>
