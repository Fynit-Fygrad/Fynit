name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DATABASE_URL,SESSION_SECRET
          script: |
            git config --global --add safe.directory /var/www/Fynit
            cd /var/www/Fynit
            git fetch origin main
            git reset --hard origin/main
            chown -R www-data:www-data /var/www/Fynit
            chmod -R 755 /var/www/Fynit
            # Actualizar variables de entorno en el VPS
            touch .env
            sed -i '/^DATABASE_URL=/d' .env
            sed -i '/^SESSION_SECRET=/d' .env
            echo "DATABASE_URL=$DATABASE_URL" >> .env
            echo "SESSION_SECRET=$SESSION_SECRET" >> .env
            npm install
            # Aplicar migracion SQL directamente (idempotente)
            sudo -u postgres psql -d fynit_db -f /var/www/Fynit/prisma/migrations/20260919_init/migration.sql
            npm run build
            pm2 restart fynit-next
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
